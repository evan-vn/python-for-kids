    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);

  <script>
    // --- LANGUAGE SWITCHER CONTROLLER ---
    function toggleLanguage() {
      currentLang = currentLang === 'vi' ? 'en' : 'vi';
      playBeep(600, 'triangle', 0.06);

      const viFlag = document.getElementById('langViFlag');
      const enFlag = document.getElementById('langEnFlag');
      if (currentLang === 'vi') {
        viFlag.className = 'text-neonCyan font-bold';
        enFlag.className = 'text-slate-400 font-normal';
      } else {
        viFlag.className = 'text-slate-400 font-normal';
        enFlag.className = 'text-neonCyan font-bold';
      }

      applyLanguage();
    }

    function applyLanguage() {
      const ui = UI_I18N[currentLang];

      document.getElementById('uiBannerBadge').innerText = ui.bannerBadge;
      document.getElementById('uiSelectLabel').innerText = ui.selectLabel;
      document.getElementById('uiTabConceptText').innerText = ui.tabConcept;
      document.getElementById('uiTabChallengeText').innerText = ui.tabChallenge;
      document.getElementById('uiRadarTitle').innerText = ui.radarTitle;
      document.getElementById('uiResetBtn').innerText = ui.resetBtn;
      document.getElementById('uiRunBtnText').innerText = ui.runBtnText;
      document.getElementById('uiConsoleHeader').innerText = ui.consoleHeader;
      document.getElementById('uiClearBtn').innerText = ui.clearBtn;

      if (isPyodideReady) {
        document.getElementById('uiWasmStatusText').innerText = ui.wasmReady;
      } else {
        document.getElementById('uiWasmStatusText').innerText = ui.wasmLoading;
      }

      updateDropdownOptions();
      renderLessonContent();
    }

    function updateDropdownOptions() {
      const select = document.getElementById('lessonSelect');
      const savedValue = currentLessonId;
      select.innerHTML = '';

      for (let i = 1; i <= 11; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = LESSONS_DB[i].title[currentLang];
        if (i === savedValue) opt.selected = true;
        select.appendChild(opt);
      }
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', async () => {
      initCanvas();
      updateDropdownOptions();
      renderLessonContent();
      await initPyodide();
    });

    // --- PYODIDE CLIENT EXECUTION (0$ SERVER COST) ---
    async function initPyodide() {
      const statusEl = document.getElementById('pyodideStatus');
      const ui = UI_I18N[currentLang];
      try {
        pyodideInstance = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"
        });
        isPyodideReady = true;
        statusEl.innerHTML = `
          <span class="inline-block w-2 h-2 bg-neonGreen rounded-full"></span>
          <span id="uiWasmStatusText" class="text-neonGreen">${ui.wasmReady}</span>
        `;
        playBeep(880, 'sine', 0.15);
      } catch (err) {
        statusEl.innerHTML = `<span class="text-neonPink">Engine Glitch</span>`;
        console.error(err);
      }
    }

    // --- TAB SWITCHER ---
    function switchTab(tabName) {
      currentTab = tabName;
      playBeep(520, 'triangle', 0.05);

      const conceptBtn = document.getElementById('tabConceptBtn');
      const challengeBtn = document.getElementById('tabChallengeBtn');

      if (tabName === 'concept') {
        conceptBtn.className = "flex-1 py-3 px-3 text-xs flex items-center justify-center space-x-2 tab-active transition-all";
        challengeBtn.className = "flex-1 py-3 px-3 text-xs flex items-center justify-center space-x-2 tab-inactive transition-all";
      } else {
        conceptBtn.className = "flex-1 py-3 px-3 text-xs flex items-center justify-center space-x-2 tab-inactive transition-all";
        challengeBtn.className = "flex-1 py-3 px-3 text-xs flex items-center justify-center space-x-2 tab-active transition-all";
      }
      renderLessonContent();
    }

    // --- RENDER DYNAMIC LESSON CONTENT (LOCALIZED) ---
    function renderLessonContent() {
      const lesson = LESSONS_DB[currentLessonId];
      const container = document.getElementById('lessonContainer');
      const editor = document.getElementById('codeEditor');
      const ui = UI_I18N[currentLang];

      if (currentTab === 'concept') {
        const points = lesson.concept.keyPoints[currentLang];
        let pointsHtml = points.map(p => `
          <div class="bg-cyberDark/80 p-3 rounded border border-cyberBorder">
            <div class="text-neonCyan font-bold text-xs mb-1">${p.name}</div>
            <p class="text-xs text-slate-300 leading-relaxed">${p.desc}</p>
            <pre class="mt-2 text-[11px] bg-black/60 p-2 rounded text-neonGreen font-mono overflow-x-auto">${p.eg}</pre>
          </div>
        `).join('');

        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase bg-neonCyan/20 text-neonCyan border border-neonCyan/40">
                ${lesson.concept.badge[currentLang]}
              </span>
              <span class="text-xs text-slate-400 font-mono">${ui.levelPrefix} ${currentLessonId}/11</span>
            </div>
            <h2 class="text-base font-cyber font-bold text-white tracking-wide">${lesson.title[currentLang]}</h2>
            <div class="p-3 bg-neonCyan/5 border-l-2 border-neonCyan text-xs text-slate-300 italic">
              "${lesson.concept.story[currentLang]}"
            </div>
            <div class="space-y-3">
              ${pointsHtml}
            </div>
            <div class="pt-2">
              <button onclick="loadDemoCode()" class="w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-neonCyan border border-neonCyan/40 rounded text-xs font-mono font-bold transition flex items-center justify-center space-x-2">
                <span>${ui.loadDemoBtn}</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </button>
            </div>
          </div>
        `;
        editor.value = lesson.concept.demoCode;
        document.getElementById('currentFileName').innerText = `demo_tier_${currentLessonId}.py`;
      } else {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase bg-neonPink/20 text-neonPink border border-neonPink/40">
                ${lesson.challenge.badge[currentLang]}
              </span>
              <span class="text-xs text-neonYellow font-mono font-bold">+100 EXP</span>
            </div>
            <h2 class="text-base font-cyber font-bold text-white tracking-wide text-neonPink">
              🎯 ${lesson.challenge.missionTitle[currentLang]}
            </h2>
            <div class="p-3 bg-cyberDark/90 border border-cyberBorder rounded text-xs space-y-2">
              <div class="text-neonYellow font-bold flex items-center space-x-1">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
                <span>${ui.missionIntel}</span>
              </div>
              <p class="text-slate-300 leading-relaxed">${lesson.challenge.intel[currentLang]}</p>
            </div>
            <div class="p-3 bg-neonGreen/10 border border-neonGreen/30 rounded text-xs text-slate-200">
              <span class="text-neonGreen font-bold">${ui.targetGoal}</span> ${lesson.challenge.goal[currentLang]}
            </div>
            <div class="pt-2 flex gap-2">
              <button onclick="revealHint()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700">
                ${ui.hintBtn}
              </button>
              <button onclick="executePythonCode()" class="flex-1 py-2 bg-neonPink hover:bg-pink-600 text-white font-bold text-xs rounded shadow-lg shadow-neonPink/30 flex items-center justify-center space-x-1">
                <span>${ui.submitBtn}</span>
              </button>
            </div>
          </div>
        `;
        editor.value = lesson.challenge.starterCode;
        document.getElementById('currentFileName').innerText = `challenge_tier_${currentLessonId}.py`;
      }
    }

    function loadDemoCode() {
      const lesson = LESSONS_DB[currentLessonId];
      document.getElementById('codeEditor').value = lesson.concept.demoCode;
      executePythonCode();
    }

    function resetCurrentCode() {
      const lesson = LESSONS_DB[currentLessonId];
      const editor = document.getElementById('codeEditor');
      editor.value = currentTab === 'concept' ? lesson.concept.demoCode : lesson.challenge.starterCode;
      appendConsole(UI_I18N[currentLang].restoredSuccess, 'info');
      playBeep(330, 'square', 0.05);
    }

    function revealHint() {
      const lesson = LESSONS_DB[currentLessonId];
      const prefix = currentLang === 'vi' ? '// GỢI Ý MÃ LỜI GIẢI:\n' : '// SOLUTION CODE HINT:\n';
      appendConsole(`${prefix}${lesson.challenge.solutionHint}`, 'warn');
      playBeep(440, 'triangle', 0.08);
    }

    document.getElementById('lessonSelect').addEventListener('change', (e) => {
      currentLessonId = parseInt(e.target.value);
      playBeep(650, 'sine', 0.08);
      renderLessonContent();
      triggerDroneAnimation('idle');
    });

    async function executePythonCode() {
      const ui = UI_I18N[currentLang];
      if (!isPyodideReady) {
        appendConsole(ui.wasmWarn, "warn");
        return;
      }

      const code = document.getElementById('codeEditor').value;
      playBeep(700, 'sine', 0.04);

      let capturedOutput = "";
      pyodideInstance.setStdout({
        batched: (text) => {
          capturedOutput += text + "\n";
        }
      });

      appendConsole(ui.runningScript, "system");

      try {
        await pyodideInstance.runPythonAsync(code);
        
        if (capturedOutput.trim()) {
          appendConsole(capturedOutput.trim(), "stdout");
        } else {
          appendConsole(ui.noPrintOutput, "info");
        }

        triggerDroneAnimation('success');

        if (currentTab === 'challenge') {
          const lesson = LESSONS_DB[currentLessonId];
          const isPassed = lesson.challenge.validator(capturedOutput);

          if (isPassed) {
            playBeep(980, 'sine', 0.2);
            setTimeout(() => playBeep(1300, 'sine', 0.25), 100);
            appendConsole(ui.passedToast, "success");
            
            const expEl = document.getElementById('expVal');
            expEl.innerText = parseInt(expEl.innerText) + 100;
            document.getElementById('simFeedback').innerHTML = `<span class="text-neonGreen font-bold">${ui.simPassed}</span>`;
          } else {
            playBeep(220, 'sawtooth', 0.2);
            appendConsole(ui.failedToast, "error");
          }
        }

      } catch (err) {
        playBeep(180, 'sawtooth', 0.25);
        triggerDroneAnimation('fail');
        translateCyberError(err.message);
      }
    }

    // --- SMART ERROR TRANSLATOR (MULTILINGUAL) ---
    function translateCyberError(errMsg) {
      const errDict = ERROR_I18N[currentLang];
      let friendly = "";

      if (errMsg.includes("NameError")) {
        friendly = errDict.nameError;
      } else if (errMsg.includes("SyntaxError")) {
        friendly = errDict.syntaxError;
      } else if (errMsg.includes("IndentationError")) {
        friendly = errDict.indentError;
      } else if (errMsg.includes("TypeError")) {
        friendly = errDict.typeError;
      } else if (errMsg.includes("KeyError")) {
        friendly = errDict.keyError;
      } else {
        friendly = `${errDict.genericPrefix}${errMsg}`;
      }
      appendConsole(friendly, "error");
    }

    function appendConsole(text, type = "info") {
      const consoleEl = document.getElementById('consoleOutput');
      const line = document.createElement('div');
      
      switch (type) {
        case 'stdout':
          line.className = "text-neonCyan font-bold";
          break;
        case 'success':
          line.className = "text-neonGreen font-bold bg-neonGreen/10 p-1.5 rounded border border-neonGreen/30";
          break;
        case 'error':
          line.className = "text-neonPink font-medium bg-neonPink/10 p-1.5 rounded border border-neonPink/40";
          break;
        case 'warn':
          line.className = "text-neonYellow";
          break;
        case 'system':
          line.className = "text-slate-500 italic";
          break;
        default:
          line.className = "text-slate-300";
      }

      line.innerText = text;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('consoleOutput').innerHTML = `<div class="text-slate-500">// Terminal cleared.</div>`;
    }

    // --- 2D CANVAS DRONE VISUALIZER ---
    let canvas, ctx;
    let droneX = 80, droneY = 75;
    let droneState = 'idle';

    function initCanvas() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      requestAnimationFrame(renderCanvasLoop);
    }

    function triggerDroneAnimation(state) {
      droneState = state;
      if (state === 'success') {
        droneX = Math.min(canvas.width - 100, droneX + 45);
      } else if (state === 'fail') {
        droneX = Math.max(80, droneX - 25);
      }
    }

    function renderCanvasLoop(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      ctx.strokeStyle = "rgba(30, 41, 59, 0.4)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      // Target Core
      ctx.strokeStyle = "#00f0ff";
      ctx.fillStyle = "rgba(0, 240, 255, 0.1)";
      ctx.strokeRect(500, 25, 60, 100);
      ctx.fillRect(500, 25, 60, 100);
      ctx.fillStyle = "#00f0ff";
      ctx.font = "10px Orbitron";
      const coreLabel = currentLang === 'vi' ? "LÕI DỮ LIỆU" : "DATA CORE";
      ctx.fillText(coreLabel, 495, 20);

      // Hover Effect
      const hover = Math.sin(time / 200) * 4;
      const currentY = droneY + hover;

      // Draw Drone
      ctx.save();
      ctx.shadowColor = droneState === 'fail' ? '#ff0055' : '#00ff66';
      ctx.shadowBlur = 12;
      ctx.fillStyle = droneState === 'fail' ? '#ff0055' : '#00ff66';
      
      ctx.beginPath();
      ctx.moveTo(droneX + 18, currentY);
      ctx.lineTo(droneX - 12, currentY - 10);
      ctx.lineTo(droneX - 6, currentY);
      ctx.lineTo(droneX - 12, currentY + 10);
      ctx.closePath();
      ctx.fill();

      // Thruster
      ctx.fillStyle = "#00f0ff";
      ctx.fillRect(droneX - 18, currentY - 2.5, 5, 5);
      ctx.restore();

      requestAnimationFrame(renderCanvasLoop);
    }

    // Global Key Listener: Ctrl+Enter or Cmd+Enter to execute code
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        executePythonCode();
      }
    });
  </script>
